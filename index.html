<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>UKM EXPO UHN — Sains Data & AI</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📸</text></svg>">
<link rel="stylesheet" href="/assets/fonts/LuckiestGuy.css">
<link rel="stylesheet" href="/assets/fonts/Pacifico.css">
<style>
  @font-face {
    font-family: 'Fredoka';
    src: url('/assets/fonts/Fredoka-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: swap;
  }
  @font-face {
    font-family: 'Caveat';
    src: url('/assets/fonts/Caveat-Bold.ttf') format('truetype');
    font-weight: 700;
    font-display: swap;
  }

  :root {
    --cream: #fbf5e6;
    --maroon: #681a34;
    --maroon-deep: #4a0000;
    --gold: #cfa138;
    --gold-glow: #e2b448;
    --ink: #2d1d23;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #2a0b16;
    background-image: 
      radial-gradient(circle at 10% 20%, rgba(207,161,56,0.18) 0%, transparent 40%),
      radial-gradient(circle at 90% 80%, rgba(104,26,52,0.35) 0%, transparent 45%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 2px, transparent 2px 8px);
    font-family: 'Fredoka', system-ui, -apple-system, sans-serif;
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 20px 16px;
  }

  .container {
    width: 100%;
    max-width: 440px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  /* ============ HEADER ============ */
  .hero {
    background: var(--cream);
    border: 3px solid var(--maroon-deep);
    border-radius: 24px;
    padding: 20px 16px 18px;
    text-align: center;
    position: relative;
    box-shadow: 0 5px 0 var(--maroon-deep), 0 8px 16px rgba(0,0,0,0.3);
  }
  .hero::before, .hero::after {
    content: '';
    position: absolute;
    top: -8px;
    width: 54px;
    height: 16px;
    background: rgba(207,161,56,0.85);
    border-radius: 2px;
    box-shadow: 0 1px 2px rgba(0,0,0,0.2);
  }
  .hero::before { left: 24px; transform: rotate(-6deg); }
  .hero::after { right: 24px; transform: rotate(6deg); }

  .hero-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--maroon);
    color: #ffd66b;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1px;
    padding: 4px 12px;
    border-radius: 999px;
    margin-bottom: 8px;
    border: 1.5px solid var(--gold);
    text-transform: uppercase;
  }

  .hero h1 {
    font-family: 'Luckiest Guy', cursive;
    color: var(--maroon);
    font-size: clamp(28px, 8vw, 36px);
    line-height: 1.1;
    letter-spacing: 1.5px;
    text-shadow: 2px 2px 0 rgba(207,161,56,0.4);
    transform: rotate(-1deg);
  }

  .hero-subtitle {
    font-family: 'Pacifico', cursive;
    color: var(--gold);
    font-size: clamp(16px, 5vw, 20px);
    margin-top: 2px;
    text-shadow: 1px 1px 0 var(--maroon-deep);
  }

  /* ============ 2 BIG BUTTONS ============ */
  .button-group {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .main-btn {
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    border-radius: 20px;
    border: 3px solid var(--maroon-deep);
    position: relative;
    box-shadow: 0 5px 0 var(--maroon-deep), 0 8px 18px rgba(0,0,0,0.25);
    transition: transform 0.1s, box-shadow 0.1s;
    user-select: none;
  }
  .main-btn:active {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--maroon-deep), 0 4px 10px rgba(0,0,0,0.2);
  }

  .btn-icon {
    font-size: 38px;
    width: 60px;
    height: 60px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    border: 2px solid var(--maroon-deep);
    box-shadow: 0 2px 0 rgba(74,0,0,0.2);
  }

  .btn-text {
    flex: 1;
    min-width: 0;
  }
  .btn-title {
    font-family: 'Luckiest Guy', cursive;
    font-size: clamp(20px, 5.5vw, 24px);
    line-height: 1.15;
    letter-spacing: 0.8px;
  }
  .btn-sub {
    font-size: 13px;
    font-weight: 600;
    margin-top: 3px;
    opacity: 0.9;
  }

  .btn-arrow {
    font-size: 22px;
    font-weight: 700;
    flex-shrink: 0;
  }

  /* Button Themes */
  .btn-photobooth {
    background: var(--gold);
    color: var(--maroon-deep);
  }
  .btn-photobooth .btn-icon {
    background: #ffffff;
  }
  .btn-photobooth .btn-sub {
    color: #4a0000;
  }

  .btn-ai {
    background: var(--maroon);
    color: #fff6e2;
  }
  .btn-ai .btn-icon {
    background: #2a0b16;
  }
  .btn-ai .btn-sub {
    color: #ffd66b;
  }

  /* ============ FOOTER ============ */
  .footer {
    text-align: center;
    color: rgba(255,255,255,0.7);
    font-size: 11.5px;
    display: flex;
    flex-direction: column;
    gap: 3px;
    margin-top: 4px;
  }
  .footer b { color: #ffd66b; }
  .footer .brand-mark {
    font-family: 'Caveat', cursive;
    font-size: 18px;
    color: #f5eccf;
  }
</style>
</head>
<body>
<div class="container">
  <!-- HERO HEADER -->
  <header class="hero">
    <div class="hero-tag">✨ Booth Sains Data • UKM EXPO</div>
    <h1>UKM EXPO UHN</h1>
    <div class="hero-subtitle">Pilih Menu Interaktif</div>
  </header>

  <!-- 2 BIG PUNCHY BUTTONS -->
  <div class="button-group">
    
    <!-- BUTTON 1: PHOTOBOOTH -->
    <a href="/photobooth" class="main-btn btn-photobooth">
      <div class="btn-icon">📸</div>
      <div class="btn-text">
        <div class="btn-title">HARKAT PHOTOBOOTH</div>
        <div class="btn-sub">Cetak Strip Polaroid 8-Grid</div>
      </div>
      <div class="btn-arrow">➔</div>
    </a>

    <!-- BUTTON 2: AI FACE SCANNER -->
    <a href="/ai" class="main-btn btn-ai">
      <div class="btn-icon">🤖</div>
      <div class="btn-text">
        <div class="btn-title">AI FACE SCANNER</div>
        <div class="btn-sub">Tebak Umur & Rating Wajah</div>
      </div>
      <div class="btn-arrow">➔</div>
    </a>

  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <div>UKM EXPO UHN • <b>SAINS DATA</b></div>
    <div class="brand-mark">Dovey ✦ Sains Data Experience</div>
  </footer>
</div>
</body>
</html>
