<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="icon" href="data:,">
<title>UKM EXPO UHN — Photo Booth</title>
<style>
  /* ============ FONTS (self-hosted) ============ */
  @font-face {
    font-family: 'Luckiest Guy';
    src: url('assets/fonts/LuckiestGuy.ttf') format('truetype');
    font-display: swap;
  }
  @font-face {
    font-family: 'Pacifico';
    src: url('assets/fonts/Pacifico.ttf') format('truetype');
    font-display: swap;
  }

  :root {
    --cream: #f5eccf;
    --cream-dark: #eadfc0;
    --maroon: #6b1f3a;
    --maroon-deep: #4a1024;
    --gold: #c9a227;
    --blue: #3f5a7a;
    --ink: #34221e;
    --stroke: rgba(59, 20, 32, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: var(--cream);
    font-family: 'Luckiest Guy', 'Sniglet', 'Comic Sans MS', system-ui, sans-serif;
    color: var(--ink);
    -webkit-tap-highlight-color: transparent;
  }

  body {
      /* hand-drawn grain texture + dashed film-strip side borders + confetti dots */
      background-image:
        repeating-linear-gradient(90deg, rgba(63,90,122,0.16) 0 6px, transparent 6px 14px),
        repeating-linear-gradient(90deg, transparent 0 calc(100% - 14px), rgba(63,90,122,0.16) calc(100% - 14px) calc(100% - 8px)),
        radial-gradient(rgba(52,34,30,0.10) 1px, transparent 1.2px),
        radial-gradient(rgba(52,34,30,0.08) 1px, transparent 1.4px),
        radial-gradient(rgba(201,162,39,0.30) 1px, transparent 1.6px),
        radial-gradient(rgba(63,90,122,0.24) 1px, transparent 1.5px),
        linear-gradient(var(--cream), #f2e7c8);
      background-size: auto, auto, 14px 14px, 22px 22px, 37px 37px, 29px 29px, cover;
      background-position: 0 0, 100% 0, 0 0, 11px 7px, 13px 21px, 7px 9px, 0 0;
      background-repeat: repeat, repeat, repeat, repeat, repeat, repeat, no-repeat;
      min-height: 100dvh;
    }

  /* dashed center film strip (vertical) */
  body::before {
    content: '';
    position: fixed; inset: 0;
    pointer-events: none;
    background:
      linear-gradient(90deg, transparent calc(50vw - 4px), rgba(63,90,122,0.10) calc(50vw - 4px), rgba(63,90,122,0.10) calc(50vw + 4px), transparent calc(50vw + 4px));
    z-index: 0;
  }

  .app { position: relative; z-index: 1; min-height: 100dvh; display: flex; flex-direction: column; }

  /* ============ DESKTOP: frame tengah kayak booth (film strip kiri-kanan) ============ */
  @media (min-width: 780px) {
    .app {
      max-width: 720px; margin: 0 auto;
      border-left: 8px dashed var(--blue); border-right: 8px dashed var(--blue);
      background: rgba(245,236,207,0.35);
    }
    .toolbar { padding: 16px 24px; }
    .cam-wrap { width: min(480px, calc(100% - 24px)); }
    .sheet { max-width: 620px; }
  }

  /* ============ TOOLBAR ============ */
  .toolbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 16px; flex-wrap: wrap; gap: 8px;
    border-bottom: 3px dashed var(--blue);
  }
  .brand { display: flex; align-items: baseline; gap: 10px; }
  .brand h1 {
    font-family: 'Luckiest Guy', 'Comic Sans MS', cursive;
    color: var(--maroon); font-size: clamp(18px, 4.2vw, 34px);
    letter-spacing: 1.5px; line-height: 1;
    transform: rotate(-1.5deg); text-shadow: 2px 2px 0 rgba(201,162,39,0.35);
  }
  .brand small {
    font-family: 'Pacifico', 'Brush Script MT', cursive;
    color: var(--maroon-deep); font-size: clamp(13px, 2.4vw, 18px); transform: rotate(2deg);
  }
  .count-badge {
    background: var(--maroon); color: #ffe9c9; padding: 6px 14px;
    border-radius: 999px; font-size: 15px; letter-spacing: 1px;
    box-shadow: 2px 3px 0 rgba(74,16,36,0.35); white-space: nowrap;
  }
  .count-badge b { color: #ffd66b; font-size: 18px; }

  /* ============ TABS ============ */
  .tabs { display: flex; gap: 0; padding: 0 12px; margin-top: 10px; }
  .tab {
    flex: 1; text-align: center; padding: 10px 8px; font-size: 16px; letter-spacing: 1px;
    background: var(--cream-dark); color: var(--maroon-deep);
    border: 3px solid var(--maroon-deep); border-bottom: none;
    border-radius: 16px 16px 0 0; cursor: pointer;
    transform: translateY(3px); transition: transform .15s, background .15s;
    user-select: none;
  }
  .tab.active {
    background: var(--maroon); color: #ffe9c9; transform: translateY(0);
    box-shadow: 0 -3px 0 var(--gold);
  }

  .panels { flex: 1; display: flex; flex-direction: column; }
  .panel { display: none; flex-direction: column; flex: 1; }
  .panel.active { display: flex; }

  /* ============ CAMERA PANEL ============ */
  .cam-wrap {
    position: relative; margin: 12px auto; border-radius: 20px; overflow: hidden;
    border: 4px solid var(--maroon-deep);
    box-shadow: 0 6px 0 rgba(74,16,36,0.35);
    background: #1a1420; aspect-ratio: 3/4; max-height: 62vh;
    width: calc(100% - 24px);
  }
  #video { width: 100%; height: 100%; object-fit: contain; display: block; }
  #video.mirror { transform: scaleX(-1); }

  /* HUD: satu bur per wajah, vertical di sebelah (emoji + label + bar + %) */
  .hud {
    position: absolute; top: 10px; left: 10px; z-index: 5;
    background: rgba(255,250,236,0.92); border: 3px solid var(--maroon-deep);
    border-radius: 14px; padding: 8px 12px; display: flex;
    flex-direction: column; gap: 6px; max-height: 78%;
    box-shadow: 3px 3px 0 rgba(74,16,36,0.35); font-family: 'Luckiest Guy', cursive;
  }
  .chip { display: flex; align-items: center; gap: 8px; }
  .chip .n { width: 20px; height: 20px; border-radius: 50%; background: var(--gold); color: var(--maroon-deep);
    font-size: 12px; display: flex; align-items: center; justify-content: center; flex: none; }
  .chip .emoji { width: 42px; height: 42px; line-height: 1; display: flex; align-items: center; justify-content: center; font-size: 30px;
    background: #fff; border: 2px solid var(--gold); border-radius: 50%; transform: rotate(-4deg);
    box-shadow: 2px 2px 0 rgba(74,16,36,0.3); }
  .chip .label { font-size: 12px; color: var(--maroon-deep); letter-spacing: 1px; min-width: 74px; text-align: center; }
  .chip .pct { font-size: 17px; color: var(--maroon); min-width: 44px; text-align: right; }
  .chip .bar-outer { width: 60px; height: 12px; background: #e3d5ae; border-radius: 7px; border: 2px solid var(--maroon-deep); overflow: hidden; }
  .chip .bar-inner { height: 100%; width: 0%; background: linear-gradient(90deg, #7a1f3f, #e0a63f); border-radius: 5px; }

  /* scanning guide frame — sticker lucu "SMILE!" */
  .scan-hint { position: absolute; top: 14px; right: 12px; z-index: 4; pointer-events: none;
    background: var(--cream); color: var(--maroon); border: 3px solid var(--maroon-deep);
    border-radius: 14px; padding: 8px 14px; font-size: 18px; letter-spacing: 1.5px; text-align: center;
    box-shadow: 3px 3px 0 rgba(74,16,36,0.35); transform: rotate(3deg); max-width: 46%; line-height: 1.2; }
  .scan-hint:empty { display: none; }

  .toast { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); z-index: 6;
    background: rgba(107,31,58,0.94); color: #fff6e2; font-family: 'Luckiest Guy', cursive;
    padding: 8px 18px; border-radius: 14px; border: 2px solid var(--gold);
    font-size: 15px; letter-spacing: 1px; opacity: 0; transition: opacity .3s; pointer-events: none; }

  .cam-controls { display: flex; gap: 12px; justify-content: center; padding: 6px 12px 6px; align-items: center; flex-wrap: wrap; }
  .cam-shoot-row { display: flex; justify-content: center; padding: 4px 12px 14px; }
  .btn {
    font-family: 'Luckiest Guy', cursive; font-size: 18px; letter-spacing: 1px;
    border: none; border-radius: 999px; padding: 13px 26px; cursor: pointer;
    color: #fff6e2; background: var(--maroon);
    box-shadow: 0 4px 0 var(--maroon-deep), 0 6px 10px rgba(0,0,0,0.2);
    transition: transform .1s, box-shadow .1s; touch-action: manipulation;
  }
  .btn:active { transform: translateY(4px); box-shadow: 0 0 0 var(--maroon-deep); }
  .btn.gold { background: #c98a20; box-shadow: 0 4px 0 #7c5310; }
  .btn.ghost { background: var(--cream-dark); color: var(--maroon-deep); box-shadow: 0 4px 0 rgba(74,16,36,0.4); }
  .btn.blue { background: var(--blue); box-shadow: 0 4px 0 #26384d; }
  .btn.big { font-size: 22px; padding: 16px 36px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }

  /* JEPRET pulse halus biar menggoda */
  @keyframes jeppulse {
    0%, 100% { transform: scale(1); box-shadow: 0 4px 0 var(--maroon-deep), 0 6px 10px rgba(0,0,0,0.2); }
    50% { transform: scale(1.045); box-shadow: 0 4px 0 var(--maroon-deep), 0 0 18px rgba(201,162,39,0.65); }
  }
  .btn.big:not(:disabled) { animation: jeppulse 1.6s ease-in-out infinite; }
  .btn.big:not(:disabled):active { animation: none; transform: translateY(4px); }

  /* ============ LAYOUT / PRINT PANEL ============ */
  .layout-panel { padding: 12px; flex: 1; display: flex; flex-direction: column; align-items: center; }
  .sheet {
    width: 100%; max-width: 560px;
    background:
      radial-gradient(rgba(52,34,30,0.08) 1px, transparent 1.2px),
      radial-gradient(rgba(201,162,39,0.22) 1.5px, transparent 1.8px),
      radial-gradient(rgba(63,90,122,0.18) 1.2px, transparent 1.6px),
      linear-gradient(var(--cream), #f2e7c8);
    background-size: 16px 16px, 34px 34px, 28px 28px, cover;
    border: 4px solid var(--maroon-deep);
    border-radius: 20px; padding: 18px 14px 16px;
    box-shadow: 0 8px 0 rgba(74,16,36,0.35);
    position: relative;
  }
  /* dashed film-strip borders on sheet */
  .sheet::before, .sheet::after {
    content: ''; position: absolute; top: 14px; bottom: 14px; width: 8px;
    background: repeating-linear-gradient(180deg, rgba(63,90,122,0.35) 0 6px, transparent 6px 14px);
  }
  .sheet::before { left: 8px; }
  .sheet::after { right: 8px; }

  .sheet-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 18px 8px; position: relative; }
  /* washi tape scotch-style di pojok sheet */
  .sheet-head::before, .sheet-head::after {
    content: ''; position: absolute; top: -18px; width: 84px; height: 24px;
    background: repeating-linear-gradient(45deg, rgba(201,162,39,0.9) 0 8px, rgba(237,211,133,0.9) 8px 16px);
    border-radius: 3px; box-shadow: 0 2px 3px rgba(52,34,30,0.22);
    opacity: .92; z-index: 5;
  }
  .sheet-head::before { left: 8px; transform: rotate(-5deg); }
  .sheet-head::after { right: 8px; transform: rotate(5deg); }
  .sheet-head h2 {
    font-family: 'Luckiest Guy', cursive; color: var(--maroon); font-size: clamp(24px, 6.5vw, 34px);
    letter-spacing: 2px; text-shadow: 2px 2px 0 rgba(201,162,39,0.35); transform: rotate(-1.5deg);
  }
  .sheet-head .play { color: var(--maroon); font-size: 20px; transform: rotate(-8deg); text-shadow: 1px 1px 0 rgba(201,162,39,0.35); }

  .sheet-body { display: flex; gap: 12px; padding: 10px 16px; position: relative; }
  .sheet-col { flex: 1; display: flex; flex-direction: column; gap: 12px; }
  
  /* Polaroid-style mini card: foto agak dikecilkan, ada ruang scrapbook ornamen */
  .box {
    aspect-ratio: 1; border-radius: 14px; position: relative;
    background: #ffffff;
    border: 2px solid var(--maroon-deep);
    box-shadow: 0 3px 0 rgba(74,16,36,0.18);
    padding: 6px;
    cursor: grab;
    user-select: none;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .box.drag-over {
    transform: scale(1.04);
    box-shadow: 0 0 10px var(--gold);
    border-color: var(--gold);
  }
  .box.dragging {
    opacity: 0.4;
  }
  .box .ph {
    position: absolute; inset: 6px; border-radius: 9px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(107,31,58,0.35); font-size: 34px;
    background: repeating-linear-gradient(45deg, #dcd3ba 0 10px, #efe6cc 10px 20px);
  }
  .box .ph svg { width: 100%; height: 100%; opacity: .5; }
  .box img {
    width: calc(100% - 12px); height: calc(100% - 12px);
    object-fit: cover; position: absolute; top: 6px; left: 6px;
    border-radius: 9px; border: 1px solid rgba(74,16,36,0.15);
    pointer-events: none;
  }
  .box .n {
    position: absolute; top: -6px; left: -6px; background: var(--gold); color: var(--maroon-deep);
    min-width: 22px; height: 22px; border-radius: 6px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; border: 1.5px solid var(--maroon-deep); z-index: 4;
    box-shadow: 1px 1.5px 0 rgba(74,16,36,0.2);
  }
  .box .x {
    position: absolute; top: -6px; right: -6px; width: 22px; height: 22px; border-radius: 6px;
    background: var(--cream); color: var(--maroon); border: 1.5px solid var(--maroon-deep); font-size: 13px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 4;
  }
  .box.empty .x { display: none; }
  /* emoji lucu pojok kanan atas tiap foto — gelembung putih border emas (sync DOM ↔ canvas) */
  .box .e {
    position: absolute; top: 2px; right: 2px; width: clamp(28px, 6.5vw, 36px); height: clamp(28px, 6.5vw, 36px); z-index: 4;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 2px solid var(--gold); border-radius: 50%; transform: rotate(6deg);
    box-shadow: 1.5px 1.5px 0 rgba(74,16,36,0.22);
    font-size: clamp(14px, 3.2vw, 18px); line-height: 1;
    cursor: pointer;
  }
  .box.empty .e { display: none; }

  /* mini washi scotch tape di sudut foto 1 & 8 untuk aksen scrapbook */
  .sheet-col:first-child .box:first-child::after {
    content: ''; position: absolute; top: -3px; left: 14px; width: 28px; height: 9px;
    background: rgba(201,162,39,0.75); border-radius: 2px; transform: rotate(-12deg); z-index: 3;
    box-shadow: 0 1px 2px rgba(52,34,30,0.2);
  }
  .sheet-col:last-child .box:last-child::after {
    content: ''; position: absolute; bottom: -3px; right: 14px; width: 28px; height: 9px;
    background: rgba(201,162,39,0.75); border-radius: 2px; transform: rotate(-8deg); z-index: 3;
    box-shadow: 0 1px 2px rgba(52,34,30,0.2);
  }

  /* Ornamen Scrapbook Stiker di sela-sela grid */
  .deco-sticker {
    position: absolute; pointer-events: none; z-index: 6; font-size: 18px;
    filter: drop-shadow(1px 2px 0 rgba(74,16,36,0.25));
  }

  /* Toolbar Sticker Customizer di Tab Cetak */
  .sticker-bar {
    display: flex; align-items: center; justify-content: center; gap: 6px; margin: 10px auto 4px;
    background: var(--cream-dark); border: 2px solid var(--maroon-deep); border-radius: 14px;
    padding: 8px 12px; flex-wrap: wrap; max-width: 520px; box-shadow: 2px 2px 0 rgba(74,16,36,0.2);
  }
  .sticker-bar span { font-size: 13px; font-weight: 700; color: var(--maroon-deep); width: 100%; text-align: center; margin-bottom: 2px; }
  .sticker-btn {
    font-size: 20px; background: #fff; border: 1.5px solid var(--gold); border-radius: 8px;
    width: 36px; height: 36px; display: flex; align-items: center; justify-content: center;
    cursor: pointer; transition: transform 0.1s, background 0.1s;
  }
  .sticker-btn:hover { background: #fff8e8; }
  .sticker-btn:active { transform: scale(0.9); }
  .sticker-btn.clear { font-size: 12px; font-weight: 700; width: auto; padding: 0 10px; height: 36px; color: var(--maroon); border-color: var(--maroon); background: #ffebeb; }

  /* Floating drag sticker on sheet */
  .sheet-sticker {
    position: absolute; font-size: 24px; cursor: move; user-select: none; z-index: 10;
    filter: drop-shadow(1px 2px 0 rgba(74,16,36,0.25));
  }
  .sheet-sticker .del {
    position: absolute; top: -6px; right: -6px; width: 14px; height: 14px; border-radius: 50%;
    background: var(--maroon); color: #fff; font-size: 9px; display: none; align-items: center; justify-content: center;
  }
  .sheet-sticker:hover .del { display: flex; }

  .sheet-foot { display: flex; align-items: center; justify-content: space-between; padding: 12px 18px 2px; }
  .sheet-foot .sains { font-family: 'Luckiest Guy', cursive; color: var(--maroon); font-size: clamp(14px, 3.4vw, 18px); letter-spacing: 2px; transform: rotate(1.5deg); }
  .sheet-foot .dovey { font-family: 'Pacifico', 'Brush Script MT', cursive; font-size: clamp(16px, 4vw, 22px); color: #34221e; transform: rotate(-3deg); }
  .sheet-foot .rings { display: flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 700; color: var(--maroon); letter-spacing: 1px; }

  .layout-actions { display: flex; gap: 12px; margin-top: 14px; justify-content: center; flex-wrap: wrap; }

  /* QR download box on print sheet */
  .qr-box {
    display: flex; align-items: center; gap: 12px; margin: 2px 20px 0;
    background: rgba(255,255,255,0.55); border: 2px dashed var(--maroon-deep);
    border-radius: 14px; padding: 8px 12px;
  }
  .qr-box .qr { flex: none; width: 150px; height: 150px; }
  .qr-box svg { width: 150px; height: 150px; display: block; }
  .qr-box p { font-size: 13px; color: var(--maroon-deep); line-height: 1.35; letter-spacing: .3px; }
  .qr-box .dl-link { display: none; font-size: 12px; word-break: break-all; color: var(--blue); margin-top: 3px; }

  /* caption lucu — strip di atas barcode */
  .caps { margin: 4px 20px 6px; display: flex; flex-direction: column; gap: 4px;
    background: rgba(255,255,255,0.45); border-left: 4px solid var(--gold); border-radius: 0 10px 10px 0;
    padding: 8px 12px; }
  .cap-line { font-family: system-ui, sans-serif; font-weight: 600; color: #34221e; font-size: clamp(13px, 3.4vw, 16px); line-height: 1.45;
    display: flex; align-items: center; gap: 8px; }
  .cap-line .cap-face { flex: none; width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-size: 16px; line-height: 1; }
  .caps:empty { display: none; }

  .empty-state { text-align: center; margin-top: 10px; color: var(--maroon-deep); opacity: .8; font-size: 15px; letter-spacing: 1px; }

  /* ============ PRINT ============ */
  @media print {
    * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
    body { background: var(--cream) !important; }
    body::before { display: none !important; }
    .app { display: block !important; }
    .toolbar, .tabs, .cam-wrap, .cam-controls, .layout-actions, .empty-state, .scan-hint { display: none !important; }
    .panels, .panel { display: block !important; }
    .layout-panel { padding: 0 !important; }
    .sheet {
      max-width: 100% !important; border: 3px solid var(--maroon-deep) !important;
      border-radius: 0 !important; box-shadow: none !important; margin: 0 auto;
      width: 100%;
    }
    /* A4 portrait: 8 boxes fit nicely */
    .sheet-body { padding: 8px 16px; }
    .box { break-inside: avoid; }
    .box img { opacity: 1 !important; filter: none !important; visibility: visible !important; }
    .box .x { display: none !important; }  /* tombol hapus nggak ikut cetak */
    .qr-box { display: flex !important; border-style: solid; }
    .qr-box .dl-link { display: none !important; }
    .caps { display: flex !important; }
    .cap-line { font-size: 13px; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="toolbar">
    <div class="brand">
      <h1>UKM EXPO UHN</h1>
      <small>PHOTO BOOTH ✦</small>
    </div>
    <div class="count-badge">📸 <b id="countBox">0</b>/8</div>
  </div>

  <div class="tabs">
    <div class="tab active" data-panel="cam" id="tabCam">📷 KAMERA</div>
    <div class="tab" data-panel="layout" id="tabLayout">🖼️ CETAK</div>
  </div>

  <div class="panels">
    <!-- ============ CAMERA ============ -->
    <div class="panel active" id="panel-cam">
      <div class="cam-wrap" id="camWrap">
        <video id="video" autoplay playsinline muted></video>
        <div class="scan-hint" id="scanHint">SMILE! 😁</div>
        <div class="hud" id="hud" style="display:none"></div>
        <div class="toast" id="toast"></div>
      </div>
      <div class="cam-controls">
        <button class="btn ghost" id="btnFlip">🔄 Kamera</button>
        <button class="btn gold" id="btnDone">✅ Done</button>
        <button class="btn blue" id="btnReset">🗑️ Reset</button>
      </div>
      <div class="cam-shoot-row">
        <button class="btn big" id="btnShoot">📸 JEPRET!</button>
      </div>
    </div>

    <!-- ============ LAYOUT ============ -->
    <div class="panel" id="panel-layout">
      <div class="layout-panel">
        <div class="sheet" id="sheet">
          <div class="sheet-head">
            <span class="play">▶</span>
            <h2>UKM EXPO UHN</h2>
            <span style="color:var(--maroon)">✳</span>
          </div>
          <div class="sheet-body">
            <div class="sheet-col" id="colA">
              <div class="box empty" data-i="0"><div class="n">1</div><div class="x">✕</div><div class="e" style="display:none"></div><div class="ph">✦</div></div>
              <div class="box empty" data-i="2"><div class="n">3</div><div class="x">✕</div><div class="e" style="display:none"></div><div class="ph">✦</div></div>

<script src="assets/qrcode.js"></script>
<script type="module">
// ============ ASSETS ============
const MODEL_URL = 'assets/model/face_landmarker.task';

// ============ STATE ============
let photos = [];          // array of dataURL, up to 8
let customStickers = [];  // array of { id, emoji, x, y, rot }
let faceMode = false;     // mediapipe ready?
let stream = null;
let facing = 'user';      // 'user' | 'environment'
let landmarker = null;
let frameT = null;

// ============ DOM ============
const $ = (id) => document.getElementById(id);
const video = $('video'), hud = $('hud');
const countBox = $('countBox'), scanHint = $('scanHint'), camWrap = $('camWrap');

// ============ MEDIAPIPE FACE LANDMARKER (local assets) ============
async function initVision() {
  // CPU only: WASM+GPU delegate hangs on many phones / headless; CPU is reliable everywhere
  try {
    const { FilesetResolver, FaceLandmarker } = await import('./assets/wasm/vision_bundle.mjs');
    const vision = await FilesetResolver.forVisionTasks('./assets/wasm/');
    landmarker = await FaceLandmarker.createFromOptions(vision, {
      baseOptions: { modelAssetPath: MODEL_URL, delegate: 'CPU' },
      runningMode: 'VIDEO',
      numFaces: 5,
      outputFaceBlendshapes: true
    });
    faceMode = true;
    console.log('FaceLandmarker ready (CPU)');
    setHint('💡 Arah ke kamera');
  } catch (e) {
    console.error('MediaPipe init failed:', e);
    setHint('⚠️ AI wajah tadi start — foto tetap jalan');
  }
}

function setHint(html) {
  scanHint.innerHTML = html;
}

// ============ CAMERA ============
async function startCamera() {
  stopCamera();
  const facingMode = facing === 'environment' ? { exact: 'environment' } : 'user';
  // No resolution constraint: camera native FOV -> framing normal aja kamera biasa (head+shoulders)
  const opts = {
    video: { facingMode },
    audio: false
  };
  try {
    stream = await navigator.mediaDevices.getUserMedia(opts);
  } catch (e) {
    // fallback: any camera
    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
  }
  video.srcObject = stream;
  await video.play().catch(() => {});
  // mirror preview HANYA kamera depan; kamera belakang tampil normal
  video.classList.toggle('mirror', facing === 'user');
  video.addEventListener('loadedmetadata', adaptFrame, { once: true });
  loop();
}

// keep the cam box in sync with the real stream aspect (contain => never crop)
function adaptFrame() {
  if (video.videoWidth && video.videoHeight) {
    const a = video.videoWidth + ' / ' + video.videoHeight;
    if (camWrap.style.aspectRatio !== a) camWrap.style.aspectRatio = a;
  }
}

function stopCamera() {
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  if (frameT) { cancelAnimationFrame(frameT); frameT = null; }
}

// ============ OVERLAY LOOP ============
let lastFaces = [], lastBs = null, lastDet = 0;
function loop() {
  if (!faceMode || !landmarker) {
    return requestAnimationFrame(loop);
  }
  if (video.readyState >= 2 && video.videoWidth) {
    adaptFrame();
    // throttle detection: CPU wasm ~12fps is smooth enough, keeps phone cool
    const now = performance.now();
    if (now - lastDet >= 80) {
      lastDet = now;
      let result;
      try {
        result = landmarker.detectForVideo(video, now);
      } catch (e) { /* skip frame */ }
      lastFaces = (result && result.faceLandmarks) || [];
      lastBs = result ? result.faceBlendshapes : null;
    }

    if (lastFaces.length) {
      hud.style.display = 'flex';
      setHint('');
      renderHud(lastFaces, lastBs);
    } else {
      hud.style.display = 'none';
      hud.innerHTML = '';
      if (!scanHint.innerHTML) setHint('🔍 Cari wajah &hellip;');
    }
  }
  frameT = requestAnimationFrame(loop);
}

// ============ EMOJI + PERSEN (live, cam only) ============
// faceBlendshapes[i] = CategoryMask { categories:[{categoryName,score}] };
// be tolerant of both shapes (some builds return [CategoryMask])
function categoriesOf(bs) {
  if (!bs) return null;
  if (Array.isArray(bs) && bs.length && bs[0] && bs[0].categories) return bs[0].categories;
  return bs.categories || null;
}
function blendshape(bs, name) {
  const cats = categoriesOf(bs);
  if (!cats) return 0;
  const c = cats.find(x => x.categoryName === name);
  return c ? c.score : 0;
}

// emotion of one face based on its blendshapes -> {emoji,label,pct}
function emotion(bs) {
  const smile = Math.max(blendshape(bs, 'mouthSmileLeft'), blendshape(bs, 'mouthSmileRight'));
  const jaw = blendshape(bs, 'jawOpen');
  const brow = Math.max(blendshape(bs, 'browInnerUp'), blendshape(bs, 'browOuterUpLeft') + blendshape(bs, 'browOuterUpRight'));
  const eyeBlinkR = blendshape(bs, 'eyeBlinkRight');
  const eyeBlinkL = blendshape(bs, 'eyeBlinkLeft');
  const mouthFrown = Math.max(blendshape(bs, 'mouthFrownLeft'), blendshape(bs, 'mouthFrownRight'));
  const eyesWide = Math.max(blendshape(bs, 'eyeWideLeft'), blendshape(bs, 'eyeWideRight'));
  const tongue = blendshape(bs, 'tongueOut');

  if (smile > 0.45) return { emoji: '😄', label: 'SENYUM', pct: Math.round(smile * 100) };
  if (tongue > 0.35) return { emoji: '😜', label: 'CILUK BA', pct: Math.round(tongue * 100) };
  if (jaw > 0.30) return { emoji: '😮', label: 'TERKEJUT', pct: Math.round(Math.min(1, jaw + smile) * 100) };
  if (eyesWide > 0.6 && brow > 0.5) return { emoji: '😳', label: 'KAGET', pct: Math.round(Math.min(1, eyesWide + brow) * 100) };
  if (brow > 0.35) return { emoji: '🤨', label: 'HERAN', pct: Math.round(Math.min(1, brow + smile) * 100) };
  if ((eyeBlinkR > 0.7) !== (eyeBlinkL > 0.7)) return { emoji: '😉', label: 'KEDIP', pct: 92 };
  if (mouthFrown > 0.25) return { emoji: '😒', label: 'CEMBERUT', pct: Math.round(mouthFrown * 100) };
  if (smile > 0.15) return { emoji: '🙂', label: 'TENANG', pct: Math.round(smile * 90) };
  return { emoji: '😶', label: 'POLOS', pct: Math.max(25, Math.round((1 - jaw) * 40)) };
}

// one chip per face (up to 5 wajah) — each with its own emoji + persen
function renderHud(faces, blendshapes) {
  const n = Math.min(faces.length, 5);
  // ensure exact chip count
  while (hud.children.length < n) {
    const c = document.createElement('div');
    c.className = 'chip';
    c.innerHTML = '<span class="n"></span><span class="emoji"></span><span class="label"></span>' +
      '<span class="bar-outer"><span class="bar-inner"></span></span><span class="pct"></span>';
    hud.appendChild(c);
  }
  while (hud.children.length > n) hud.removeChild(hud.lastChild);

  for (let i = 0; i < n; i++) {
    const chip = hud.children[i];
    const e = emotion(blendshapes && blendshapes[i]);
    chip.querySelector('.n').textContent = n > 1 ? (i + 1) + '' : '';
    chip.querySelector('.emoji').textContent = e.emoji;
    chip.querySelector('.label').textContent = e.label;
    chip.querySelector('.pct').textContent = e.pct + '%';
    chip.querySelector('.bar-inner').style.width = Math.min(100, e.pct) + '%';
  }
}

// ============ CAPTURE ============
// test hook (harmless)
window.__h = { renderHud, emotion, capture, renderSheet, landmarker: () => landmarker, downloadSheet };

// funny caption + emoji per photo (dari % emoji hasil deteksi wajah)
const FUN_EMOJI = ['🥳','😜','🤪','😍','🤩','😎','🥸','🤡','👻','🥴','😺','🤣','🦄','🍭','🎈','💃'];
const CAPS_HIGH = [
  'wow {p}% kamu tersenyum — fix sih ini calon penghuni surga 😇',
  '{p}% senyummu semanis gula 🍬',
  '{p}% kece — bintang iklan nggak pake kontrak ⭐',
  '{p}% hepi — foto ini wajib dibingkai 🖼️'
];
const CAPS_MID = [
  '{p}% senyum — lumayan, pabrik senyum lagi produksi 😄',
  '{p}% happy — dikit lagi jadi artis 🎬',
  '{p}% lucu — kalo ketawa dikasih ongkos, lo udah kaya 💸',
  '{p}% cakep — jangan senyum gitu dong, hati meleleh 🫠'
];
const CAPS_LOW = [
  '{p}% aja? serius? ayo senyum dong 😅',
  '{p}% — masih malu-malu, wajar kok 🥹',
  '{p}% — nggak apa, stone face juga ada fansnya 🗿',
  '{p}% — besok senyumnya di-update ya 🔄'
];
function randCap(pct, label) {
  const pool = pct >= 90 ? CAPS_HIGH : pct >= 70 ? CAPS_MID : CAPS_LOW;
  const t = pool[Math.floor(Math.random() * pool.length)];
  return t.replace('{p}', pct).replace('{l}', label || '');
}

function randEmoji(exclude) {
  // anti-repeat: foto berikutnya ga boleh emoji sama dgn foto terakhir
  const pool = exclude && FUN_EMOJI.includes(exclude) ? FUN_EMOJI.filter(e => e !== exclude) : FUN_EMOJI;
  return pool[Math.floor(Math.random() * pool.length)];
}

function capture() {
  if (!stream) return;
  if (photos.length >= 8) {
    toast('⛔ 8 kotak penuh — tap Reset atau Done');
    return;
  }
  // Clean frame: video WITHOUT any overlay (jangan pas jadi)
  const w = video.videoWidth, h = video.videoHeight;
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const cx = c.getContext('2d');
  // mirror to match preview — hanya kamera depan
  if (facing === 'user') { cx.translate(w, 0); cx.scale(-1, 1); }
  cx.drawImage(video, 0, 0, w, h);
  const dataURL = c.toDataURL('image/jpeg', 0.92);

  // emoji random lucu per foto + persen dari deteksi wajah (fallback acak biar tiap foto beda)
  let e = null;
  if (lastFaces.length && lastBs && lastBs[0]) e = emotion(lastBs[0]);
  const pct = e ? e.pct : 50 + Math.floor(Math.random() * 50);
  const emoji = randEmoji(photos.length ? photos[photos.length - 1].emoji : null);
  const cap = randCap(pct, e ? e.label : null);

  photos.push({ url: dataURL, pct, emoji, cap });
  renderLayout();
  // 1 cekrek = 1 foto — tetap di KAMERA, nanti Done if finish
  toast('📸 Foto ' + photos.length + '/8 ✓');
  if (photos.length >= 8) toast('🎉 Penuh! Tap Done buat cetak');
}

// transient message at bottom of camera
let toastT = null;
function toast(msg) {
  const t = $('toast');
  t.innerHTML = msg;
  t.style.opacity = 1;
  clearTimeout(toastT);
  toastT = setTimeout(() => { t.style.opacity = 0; }, 2000);
}

// ============ LAYOUT RENDER ============
function renderLayout() {
  // Isi 8 kotak: kalau cuma 1 foto -> semua kotak foto itu; kalau >1 -> urut, ulang sampai 8
  const boxes = document.querySelectorAll('.box');
  let fill = [];
  if (photos.length === 0) {
    fill = [];
  } else if (photos.length === 1) {
    fill = Array(8).fill(photos[0]);
  } else {
    for (let i = 0; i < 8; i++) fill.push(photos[i % photos.length]);
  }
  boxes.forEach(box => {
    const i = +box.dataset.i;
    const img = box.querySelector('img');
    const ph = box.querySelector('.ph');
    const xBtn = box.querySelector('.x');
    const eBadge = box.querySelector('.e');
    if (fill[i]) {
      if (!img) {
        const im = document.createElement('img');
        im.alt = 'foto';
        box.appendChild(im);
      }
      box.querySelector('img').src = fill[i].url;
      if (ph) ph.style.display = 'none';
      box.classList.remove('empty');
      xBtn.style.display = 'flex';
      if (eBadge) { eBadge.textContent = fill[i].emoji || '😄'; eBadge.style.display = 'flex'; }
      box.draggable = true;
    } else {
      if (img) img.remove();
      if (ph) ph.style.display = 'flex';
      box.classList.add('empty');
      xBtn.style.display = 'none';
      if (eBadge) eBadge.style.display = 'none';
      box.draggable = false;
    }
  });
  countBox.textContent = photos.length;
  $('emptyState').style.display = photos.length ? 'none' : '';
  renderCaptions();
  renderDomStickers();
}

// Ganti emoji acak per foto saat tap pada badge emoji
function setupEmojiPicker() {
  const EMOJI_LIST = ['😄', '😍', '✨', '😎', '🥳', '🥰', '😜', '👻', '🤡', '💃', '👑', '💖', '⭐', '🌸'];
  document.querySelectorAll('.box .e').forEach(el => {
    el.onclick = (e) => {
      e.stopPropagation();
      const box = el.closest('.box');
      const slot = +box.dataset.i;
      if (!photos.length) return;
      const pIdx = photos.length === 1 ? 0 : (slot % photos.length);
      const cur = photos[pIdx].emoji;
      const next = EMOJI_LIST[(EMOJI_LIST.indexOf(cur) + 1) % EMOJI_LIST.length];
      photos[pIdx].emoji = next;
      renderLayout();
      invalidateGallery();
    };
  });
}

// Drag and drop foto untuk tukar posisi
let draggedSlot = null;
function setupDragDrop() {
  const boxes = document.querySelectorAll('.box');
  boxes.forEach(box => {
    box.addEventListener('dragstart', (e) => {
      if (box.classList.contains('empty')) return;
      draggedSlot = +box.dataset.i;
      box.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
    });
    box.addEventListener('dragend', () => {
      box.classList.remove('dragging');
      boxes.forEach(b => b.classList.remove('drag-over'));
    });
    box.addEventListener('dragover', (e) => {
      e.preventDefault();
      if (!box.classList.contains('empty') && draggedSlot !== null) {
        box.classList.add('drag-over');
      }
    });
    box.addEventListener('dragleave', () => {
      box.classList.remove('drag-over');
    });
    box.addEventListener('drop', (e) => {
      e.preventDefault();
      box.classList.remove('drag-over');
      const targetSlot = +box.dataset.i;
      if (draggedSlot !== null && targetSlot !== draggedSlot && photos.length > 1) {
        const idxA = draggedSlot % photos.length;
        const idxB = targetSlot % photos.length;
        if (idxA !== idxB) {
          const temp = photos[idxA];
          photos[idxA] = photos[idxB];
          photos[idxB] = temp;
          renderLayout();
          invalidateGallery();
        }
      }
      draggedSlot = null;
    });
  });
}

// Custom Drag Floating Stickers on Sheet
function addSticker(emoji) {
  const sheet = $('sheet');
  const id = 'st_' + Date.now();
  // Posisi default di tengah sheet
  const x = sheet.offsetWidth / 2 + (Math.random() * 40 - 20);
  const y = sheet.offsetHeight / 2 + (Math.random() * 40 - 20);
  const rot = (Math.random() * 0.4 - 0.2);
  customStickers.push({ id, emoji, x, y, rot });
  renderDomStickers();
  invalidateGallery();
}

function renderDomStickers() {
  document.querySelectorAll('.sheet-sticker').forEach(el => el.remove());
  const sheet = $('sheet');
  customStickers.forEach(st => {
    const el = document.createElement('div');
    el.className = 'sheet-sticker';
    el.id = st.id;
    el.textContent = st.emoji;
    el.style.left = (st.x - 12) + 'px';
    el.style.top = (st.y - 12) + 'px';
    el.style.transform = `rotate(${st.rot}rad)`;

    const del = document.createElement('div');
    del.className = 'del';
    del.textContent = '✕';
    del.onclick = (e) => {
      e.stopPropagation();
      customStickers = customStickers.filter(s => s.id !== st.id);
      renderDomStickers();
      invalidateGallery();
    };
    el.appendChild(del);

    // Touch & Mouse Dragging for sticker
    let isDragging = false, startX, startY, origX, origY;
    const onStart = (cx, cy) => {
      isDragging = true;
      startX = cx; startY = cy;
      origX = st.x; origY = st.y;
    };
    const onMove = (cx, cy) => {
      if (!isDragging) return;
      const dx = cx - startX;
      const dy = cy - startY;
      st.x = Math.max(10, Math.min(sheet.offsetWidth - 10, origX + dx));
      st.y = Math.max(10, Math.min(sheet.offsetHeight - 10, origY + dy));
      el.style.left = (st.x - 12) + 'px';
      el.style.top = (st.y - 12) + 'px';
    };
    const onEnd = () => {
      if (isDragging) {
        isDragging = false;
        invalidateGallery();
      }
    };

    el.addEventListener('mousedown', (e) => {
      if (e.target.classList.contains('del')) return;
      onStart(e.clientX, e.clientY);
      const mouseMove = (ev) => onMove(ev.clientX, ev.clientY);
      const mouseUp = () => {
        onEnd();
        window.removeEventListener('mousemove', mouseMove);
        window.removeEventListener('mouseup', mouseUp);
      };
      window.addEventListener('mousemove', mouseMove);
      window.addEventListener('mouseup', mouseUp);
    });

    el.addEventListener('touchstart', (e) => {
      if (e.target.classList.contains('del')) return;
      const touch = e.touches[0];
      onStart(touch.clientX, touch.clientY);
      const touchMove = (ev) => {
        const t = ev.touches[0];
        onMove(t.clientX, t.clientY);
      };
      const touchEnd = () => {
        onEnd();
        window.removeEventListener('touchmove', touchMove);
        window.removeEventListener('touchend', touchEnd);
      };
      window.addEventListener('touchmove', touchMove);
      window.addEventListener('touchend', touchEnd);
    });

    sheet.appendChild(el);
  });
}

// caption lucu per foto — strip di ATAS barcode (QR)
function renderCaptions() {
  const strip = $('capStrip');
  if (!strip) return;
  const seen = new Set();
  const lines = [];
  photos.forEach(p => {
    if (seen.has(p.url)) return;
    seen.add(p.url);
    lines.push('<div class="cap-line"><span class="cap-face">' + (p.emoji || '😄') + '</span> ' + p.cap + '</div>');
  });
  strip.innerHTML = lines.join('');
  strip.hidden = !lines.length;
}

// remove one photo (index in original list by deleting last slot of that photo is tricky;
// simplest: x on box i removes the actual photo that maps to slot i)
function removeAtSlot(slot) {
  if (photos.length === 0) return;
  if (photos.length === 1) {
    // semua kotak foto yang sama -> hapus foto
    photos = [];
  } else {
    const idx = slot % photos.length;
    photos.splice(idx, 1);
  }
  renderLayout();
}

// ============ GALLERY (QR DOWNLOAD) ============
let galleryUrl = null;
let sheetDone = false;
// backend public: same-origin kalau host photobooth/localhost; Pages fallback ke apa.zonalayar
const API_BASE = (location.hostname === 'localhost' || location.hostname === '127.0.0.1' || location.hostname.endsWith('harkatpoto.my.id'))
  ? '' : 'https://apa.zonalayar.my.id/harkat';

async function ensureGallery() {
  if (!photos.length) return null;
  if (galleryUrl) return galleryUrl;
  try {
    const res = await fetch(API_BASE + '/api/session', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ photos: photos.map(p => p.url) })
    });
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'gagal upload');
    galleryUrl = data.url; // server balikin absolute (PUBLIC_URL) atau relative
    let qrTarget = galleryUrl;
    // sheet PNG -> server; QR langsung unduh file di scan
    try {
      const sres = await fetch(API_BASE + '/api/sheet', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ sessionId: data.id, png: await renderSheet(true) })
      });
      const sdata = await sres.json();
      if (sdata.ok) {
        sheetDone = true;
        // base dari gallery URL: works relative (localhost) & absolute (Pages->apa)
        const base = galleryUrl.replace(/\/gallery\/[0-9a-f-]+$/, '');
        qrTarget = base + '/download/' + data.id;
      }
    } catch (e2) { console.log('sheet upload failed, QR->gallery:', e2); }
    const full = qrTarget.startsWith('http') ? qrTarget : location.origin + qrTarget;
    renderQr(full);
    $('qrBox').hidden = false;
    const a = $('galleryLink');
    a.textContent = '⬇️ Download foto (PNG)';
    a.href = '#';
    a.onclick = async (ev) => { ev.preventDefault(); await downloadSheet(); };
    a.style.display = 'block';
  } catch (e) {
    console.error('gallery upload failed:', e);
    toast('⚠️ QR belum siap — cek koneksi ke server');
  }
  return galleryUrl;
}

function renderQr(text) {
  const qr = qrcode(0, 'M');
  qr.addData(text);
  qr.make();
  $('qrCode').innerHTML = qr.createSvgTag({ cellSize: 6, margin: 1, scalable: true });
}

function invalidateGallery() {
  galleryUrl = null;
  // Tetap buat QR baru jika ada foto di layout
  if (photos.length) {
    ensureGallery().catch(() => {});
  }
}

// ============ DOWNLOAD SHEET (canvas, no deps) ============
// Render layout 2×4 ke PNG — klik link QR = langsung unduh file, bukan buka halaman.
function b64ToImg(src) {
  return new Promise((ok, err) => {
    const img = new Image();
    img.onload = () => ok(img);
    img.onerror = err;
    img.src = src;
  });
}
// renderSheet(true) -> dataURL PNG (upload); renderSheet() -> Blob (download)
async function renderSheet(asDataUrl) {
  // === EXACT CLONE DOM .sheet ===
  // Ukuran DOM asli diskalakan 2.5x untuk resolusi cetak HD (crisp & clean)
  const SCALE = 2.5;
  const sheetEl = document.querySelector('.sheet');
  const sW = sheetEl.offsetWidth || 400;
  const W = Math.round(sW * SCALE);   // misal 400 * 2.5 = 1000px

  const PAD_X = Math.round(14 * SCALE);
  const PAD_TOP = Math.round(18 * SCALE);
  const PAD_BOT = Math.round(16 * SCALE);
  const GAP = Math.round(10 * SCALE);
  const ROWS = 4, COLS = 2;
  const card = Math.floor((W - PAD_X * 2 - GAP) / COLS);

  // Bagian Header
  const HEAD_H = Math.round(38 * SCALE);
  const yBody = PAD_TOP + HEAD_H + Math.round(8 * SCALE);

  // Bagian Footer
  const FOOT_H = Math.round(36 * SCALE);
  const footY = yBody + ROWS * card + (ROWS - 1) * GAP + Math.round(10 * SCALE);

  // Caption strip unik
  const seenC = new Set();
  const uniq = photos.filter(p => { if (seenC.has(p.url)) return false; seenC.add(p.url); return true; });
  const nCap = Math.min(uniq.length, 8);
  const lineH = Math.round(26 * SCALE);
  const capPadY = Math.round(8 * SCALE);
  const capH = nCap ? nCap * lineH + capPadY * 2 : 0;
  const capY0 = footY + FOOT_H + Math.round(6 * SCALE);

  const H = (nCap ? capY0 + capH : footY + FOOT_H) + PAD_BOT;

  const cv = document.createElement('canvas');
  cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');

  // 1. Background Dasar & Dots persis CSS sheet
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#f5eccf'); g.addColorStop(1, '#f2e7c8');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Confetti dots persis formula CSS
  ctx.fillStyle = 'rgba(52,34,30,0.08)';
  for (let dy = 0; dy < H; dy += Math.round(16 * SCALE))
    for (let dx = 0; dx < W; dx += Math.round(16 * SCALE)) ctx.fillRect(dx, dy, 2, 2);

  ctx.fillStyle = 'rgba(201,162,39,0.22)';
  for (let dy = 4; dy < H; dy += Math.round(34 * SCALE))
    for (let dx = 6; dx < W; dx += Math.round(34 * SCALE)) {
      ctx.beginPath(); ctx.arc(dx, dy, 1.8 * SCALE, 0, Math.PI * 2); ctx.fill();
    }

  ctx.fillStyle = 'rgba(63,90,122,0.18)';
  for (let dy = 8; dy < H; dy += Math.round(28 * SCALE))
    for (let dx = 12; dx < W; dx += Math.round(28 * SCALE)) {
      ctx.beginPath(); ctx.arc(dx, dy, 1.5 * SCALE, 0, Math.PI * 2); ctx.fill();
    }

  // Film-strip putus-putus di tepi kiri & kanan (.sheet::before / ::after)
  const stripW = Math.round(8 * SCALE);
  const stripL = Math.round(8 * SCALE);
  const stripR = W - stripL - stripW;
  ctx.fillStyle = 'rgba(63,90,122,0.35)';
  for (let sx of [stripL, stripR]) {
    for (let sy = Math.round(14 * SCALE); sy < H - Math.round(14 * SCALE); sy += Math.round(20 * SCALE)) {
      ctx.fillRect(sx, sy, stripW, Math.round(6 * SCALE));
    }
  }

  // Border luar sheet (4px * SCALE, border-radius 20px * SCALE, maroon-deep)
  const bThick = Math.round(4 * SCALE);
  const bRad = Math.round(20 * SCALE);
  ctx.strokeStyle = '#4a1024'; ctx.lineWidth = bThick;
  roundRect(ctx, bThick / 2, bThick / 2, W - bThick, H - bThick, bRad); ctx.stroke();

  // 2. Washi Tape di pojok kiri atas & kanan atas (.sheet-head::before & ::after)
  function washiTape(x, y, rot) {
    const tw = Math.round(84 * SCALE), th = Math.round(24 * SCALE);
    ctx.save(); ctx.translate(x, y); ctx.rotate(rot);
    ctx.shadowColor = 'rgba(52,34,30,0.22)'; ctx.shadowOffsetY = 2 * SCALE; ctx.shadowBlur = 1 * SCALE;
    ctx.beginPath(); ctx.rect(-tw / 2, -th / 2, tw, th); ctx.clip();
    ctx.fillStyle = 'rgba(237,211,133,0.92)'; ctx.fillRect(-tw / 2, -th / 2, tw, th);
    // diagonal stripes 45deg
    ctx.save(); ctx.rotate(Math.PI / 4);
    const PER = Math.round(16 * SCALE), SW = Math.round(8 * SCALE), EXT = Math.round(100 * SCALE);
    ctx.fillStyle = 'rgba(201,162,39,0.9)';
    for (let sx = -EXT; sx < tw + EXT; sx += PER) ctx.fillRect(sx - SW, -EXT, SW, 2 * EXT);
    ctx.restore();
    ctx.restore();
  }
  // Letak persis di atas border atas (straddling top edge)
  washiTape(PAD_X + Math.round(24 * SCALE), PAD_TOP - Math.round(10 * SCALE), -0.09);
  washiTape(W - PAD_X - Math.round(24 * SCALE), PAD_TOP - Math.round(10 * SCALE), 0.09);

  // 3. Header Text: UKM EXPO UHN & Simbol
  const headCenterY = PAD_TOP + HEAD_H / 2;
  ctx.save();
  ctx.translate(W / 2, headCenterY); ctx.rotate(-0.026);
  ctx.fillStyle = '#6b1f3a'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.round(27 * SCALE) + 'px "Luckiest Guy", "Comic Sans MS", cursive';
  ctx.shadowColor = 'rgba(201,162,39,0.35)'; ctx.shadowOffsetX = 2 * SCALE; ctx.shadowOffsetY = 2 * SCALE;
  ctx.fillText('UKM EXPO UHN', 0, 0);
  ctx.restore();
  ctx.shadowColor = 'transparent'; ctx.shadowOffsetX = 0; ctx.shadowOffsetY = 0;

  ctx.fillStyle = '#6b1f3a'; ctx.font = Math.round(18 * SCALE) + 'px system-ui';
  ctx.save(); ctx.translate(PAD_X + Math.round(14 * SCALE), headCenterY); ctx.rotate(-0.14); ctx.fillText('▶', 0, 0); ctx.restore();
  ctx.save(); ctx.translate(W - PAD_X - Math.round(14 * SCALE), headCenterY); ctx.fillText('✳', 0, 0); ctx.restore();

  // 4. 8 Boxes Foto (persis .box di DOM: background putih, border 2px, padding 4px)
  const imgs = await Promise.all(photos.map(p => b64ToImg(p.url)));
  let fill = [];
  if (photos.length === 1) fill = Array(8).fill(0);
  else for (let i = 0; i < 8; i++) fill.push(i % photos.length);

  const boxBorder = Math.round(2 * SCALE);
  const boxRadius = Math.round(12 * SCALE);
  const boxPad = Math.round(4 * SCALE);
  const numSize = Math.round(22 * SCALE);
  const numRadius = Math.round(6 * SCALE);
  const emojiSize = Math.round(30 * SCALE);

  for (let i = 0; i < ROWS * COLS; i++) {
    const src = fill[i]; if (src === undefined) break;
    const r = Math.floor(i / COLS), c = i % COLS;
    const x = PAD_X + c * (card + GAP), y = yBody + r * (card + GAP);

    // Box Frame Putih (DOM .box)
    ctx.save();
    ctx.shadowColor = 'rgba(74,16,36,0.18)'; ctx.shadowOffsetY = Math.round(3 * SCALE); ctx.shadowBlur = 0;
    roundRect(ctx, x, y, card, card, boxRadius);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = '#4a1024'; ctx.lineWidth = boxBorder;
    roundRect(ctx, x, y, card, card, boxRadius); ctx.stroke();

    // Foto di dalam Box (DOM .box img)
    const px = x + boxPad, py = y + boxPad, pw = card - boxPad * 2, ph = card - boxPad * 2;
    const imgRadius = Math.round(8 * SCALE);
    ctx.save();
    roundRect(ctx, px, py, pw, ph, imgRadius); ctx.clip();
    drawCover(ctx, imgs[src], px, py, pw, ph);
    ctx.restore();
    ctx.strokeStyle = 'rgba(74,16,36,0.15)'; ctx.lineWidth = 1 * SCALE;
    roundRect(ctx, px, py, pw, ph, imgRadius); ctx.stroke();

    // Washi Tape mini aksen di foto 1 & 8
    if (i === 0) {
      ctx.save(); ctx.translate(x + Math.round(24 * SCALE), y + Math.round(2 * SCALE)); ctx.rotate(-0.2);
      ctx.fillStyle = 'rgba(201,162,39,0.75)'; roundRect(ctx, -14 * SCALE, -4 * SCALE, 28 * SCALE, 9 * SCALE, 2 * SCALE); ctx.fill();
      ctx.restore();
    } else if (i === 7) {
      ctx.save(); ctx.translate(x + card - Math.round(24 * SCALE), y + card - Math.round(2 * SCALE)); ctx.rotate(-0.14);
      ctx.fillStyle = 'rgba(201,162,39,0.75)'; roundRect(ctx, -14 * SCALE, -4 * SCALE, 28 * SCALE, 9 * SCALE, 2 * SCALE); ctx.fill();
      ctx.restore();
    }

    // Nomor Gold kiri atas (.box .n)
    const numX = x - Math.round(6 * SCALE), numY = y - Math.round(6 * SCALE);
    ctx.fillStyle = '#c9a227';
    roundRect(ctx, numX, numY, numSize, numSize, numRadius); ctx.fill();
    ctx.strokeStyle = '#4a1024'; ctx.lineWidth = 1.5 * SCALE; ctx.stroke();
    ctx.fillStyle = '#4a1024'; ctx.font = '700 ' + Math.round(11 * SCALE) + 'px "Luckiest Guy", cursive';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(i + 1, numX + numSize / 2, numY + numSize / 2 + 0.5 * SCALE);

    // Emoji Gelembung Putih kanan atas (.box .e)
    const emX = x + card - emojiSize / 2 - Math.round(2 * SCALE);
    const emY = y + emojiSize / 2 + Math.round(2 * SCALE);
    ctx.save();
    ctx.translate(emX, emY); ctx.rotate(0.1);
    ctx.beginPath(); ctx.arc(0, 0, emojiSize / 2, 0, Math.PI * 2);
    ctx.fillStyle = '#ffffff'; ctx.fill();
    ctx.strokeStyle = '#c9a227'; ctx.lineWidth = 2 * SCALE; ctx.stroke();
    ctx.font = Math.round(14 * SCALE) + 'px system-ui'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(photos[src].emoji || '😄', 0, 0.5 * SCALE);
    ctx.restore();
  }

  // 5. Footer: SAINS DATA · ⭯ ⭮ · Dovey (.sheet-foot)
  const footCenterY = footY + FOOT_H / 2;
  ctx.save();
  ctx.translate(PAD_X + Math.round(4 * SCALE), footCenterY); ctx.rotate(0.026);
  ctx.fillStyle = '#6b1f3a'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.round(15 * SCALE) + 'px "Luckiest Guy", cursive';
  ctx.fillText('SAINS DATA', 0, 0);
  ctx.restore();

  ctx.font = '700 ' + Math.round(13 * SCALE) + 'px system-ui'; ctx.fillStyle = '#6b1f3a';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('⭯ ⭮', W / 2, footCenterY);

  ctx.save();
  ctx.translate(W - PAD_X - Math.round(4 * SCALE), footCenterY); ctx.rotate(-0.052);
  ctx.fillStyle = '#34221e'; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  ctx.font = '700 ' + Math.round(17 * SCALE) + 'px Pacifico, "Brush Script MT", cursive';
  ctx.fillText('Dovey', 0, 0);
  ctx.restore();

  // 6. Caption Strip (.caps di DOM)
  if (nCap) {
    const stripPadX = PAD_X + Math.round(4 * SCALE);
    const stripW_ = W - stripPadX * 2;
    ctx.fillStyle = 'rgba(255,255,255,0.45)';
    roundRect(ctx, stripPadX, capY0, stripW_, capH, Math.round(10 * SCALE)); ctx.fill();
    ctx.fillStyle = '#c9a227'; ctx.fillRect(stripPadX, capY0, Math.round(4 * SCALE), capH); // border-left 4px

    let ty = capY0 + capPadY;
    for (const p of uniq) {
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      ctx.font = Math.round(16 * SCALE) + 'px system-ui';
      ctx.fillText(p.emoji || '😄', stripPadX + Math.round(12 * SCALE), ty + lineH / 2);
      ctx.fillStyle = '#34221e';
      ctx.font = '600 ' + Math.round(14 * SCALE) + 'px system-ui';
      let t = p.cap;
      const maxW = stripW_ - Math.round(44 * SCALE);
      if (ctx.measureText(t).width > maxW) {
        while (t.length > 4 && ctx.measureText(t + '…').width > maxW) t = t.slice(0, -1);
        t += '…';
      }
      ctx.fillText(t, stripPadX + Math.round(36 * SCALE), ty + lineH / 2);
      ty += lineH;
    }
  }

  // 7. Custom Drag Stickers di atas Canvas
  if (customStickers && customStickers.length) {
    const sRect = sheetEl.getBoundingClientRect();
    for (const st of customStickers) {
      const relX = st.x / sRect.width;
      const relY = st.y / sRect.height;
      const canvasStX = relX * W;
      const canvasStY = relY * H;
      ctx.save();
      ctx.translate(canvasStX, canvasStY);
      ctx.rotate(st.rot || 0);
      ctx.shadowColor = 'rgba(74,16,36,0.25)'; ctx.shadowOffsetY = 2 * SCALE; ctx.shadowBlur = 1 * SCALE;
      ctx.font = Math.round(24 * SCALE) + 'px system-ui';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(st.emoji, 0, 0);
      ctx.restore();
    }
  }

  if (asDataUrl) return cv.toDataURL('image/png');
  return await new Promise(r => cv.toBlob(r, 'image/png'));
}
async function downloadSheet() {
  if (!photos.length) return;
  try { if (!galleryUrl) await ensureGallery(); } catch (e) {}
  const blob = await renderSheet();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'ukmexpo-foto-' + Date.now() + '.png';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function drawCover(ctx, img, x, y, w, h) {
  const s = Math.max(w / img.width, h / img.height);
  const dw = img.width * s, dh = img.height * s;
  ctx.drawImage(img, x + (w - dw) / 2, y + (h - dh) / 2, dw, dh);
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function setActive(panel) {
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.panel === panel));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + panel));
}

  if (photos.length) await ensureGallery();

});

document.querySelectorAll('.box .x').forEach(x => {

    const box = x.closest('.box');
